<svg xmlns="http://www.w3.org/2000/svg" width="760" height="684" aria-labelledby="t d" viewBox="0 0 760 684"><title id="t">Defense layers for PHP2Shell</title><desc id="d">Six stacked layers from the internet to monitoring: edge WAF, reverse proxy, application, PHP runtime, container and infrastructure, and monitoring. Only the PHP runtime layer, the patch, removes the vulnerability.</desc><path fill="#fff" d="M0 0h760v684H0Z"/><style>text{font-family:Helvetica,Arial,sans-serif}</style><rect width="420" height="30" x="170" y="10" fill="#fee2e2" stroke="#b91c1c" rx="15"/><text x="380" y="30" fill="#7f1d1d" font-size="13px" font-weight="600" text-anchor="middle">Internet client: unauthenticated multipart POSTs</text><path stroke="#6b7280" stroke-width="1.5" d="M380 40v6"/><path fill="#6b7280" d="M375 45h10l-5 8Z"/><rect width="740" height="76" x="10" y="54" fill="#f3f4f6" stroke="#9ca3af" rx="8"/><text x="24" y="86" fill="#1f2937" font-size="14px" font-weight="700">1. Edge</text><text x="24" y="106" fill="#4b5563" font-size="12px" font-weight="400">WAF (Akamai example)</text><rect width="176" height="52" x="188" y="66" fill="#fff" stroke="#d1d5db" rx="6"/><text x="276" y="89" fill="#1f2937" font-size="12px" font-weight="400" text-anchor="middle">Managed rules in Deny</text><text x="276" y="106" fill="#1f2937" font-size="12px" font-weight="400" text-anchor="middle">ASE 3000991, cmd injection</text><rect width="176" height="52" x="376" y="66" fill="#fff" stroke="#d1d5db" rx="6"/><text x="464" y="89" fill="#1f2937" font-size="12px" font-weight="400" text-anchor="middle">Custom virtual patch</text><text x="464" y="106" fill="#1f2937" font-size="12px" font-weight="400" text-anchor="middle">multipart shape and size</text><rect width="176" height="52" x="564" y="66" fill="#fff" stroke="#d1d5db" rx="6"/><text x="652" y="89" fill="#1f2937" font-size="12px" font-weight="400" text-anchor="middle">Rate limits and</text><text x="652" y="106" fill="#1f2937" font-size="12px" font-weight="400" text-anchor="middle">origin lock-down</text><path stroke="#6b7280" stroke-width="1.5" d="M380 130v16"/><path fill="#6b7280" d="M375 145h10l-5 8Z"/><rect width="740" height="76" x="10" y="154" fill="#f3f4f6" stroke="#9ca3af" rx="8"/><text x="24" y="186" fill="#1f2937" font-size="14px" font-weight="700">2. Proxy / web server</text><text x="24" y="206" fill="#4b5563" font-size="12px" font-weight="400">before PHP</text><rect width="176" height="52" x="188" y="166" fill="#fff" stroke="#d1d5db" rx="6"/><text x="276" y="189" fill="#1f2937" font-size="12px" font-weight="400" text-anchor="middle">Hard limits: size,</text><text x="276" y="206" fill="#1f2937" font-size="12px" font-weight="400" text-anchor="middle">parts, headers, nesting</text><rect width="176" height="52" x="376" y="166" fill="#fff" stroke="#d1d5db" rx="6"/><text x="464" y="189" fill="#1f2937" font-size="12px" font-weight="400" text-anchor="middle">Reject multipart without</text><text x="464" y="206" fill="#1f2937" font-size="12px" font-weight="400" text-anchor="middle">usable Content-Length</text><rect width="176" height="52" x="564" y="166" fill="#fff" stroke="#d1d5db" rx="6"/><text x="652" y="189" fill="#1f2937" font-size="12px" font-weight="400" text-anchor="middle">Multipart only on</text><text x="652" y="206" fill="#1f2937" font-size="12px" font-weight="400" text-anchor="middle">routes that need it</text><path stroke="#6b7280" stroke-width="1.5" d="M380 230v16"/><path fill="#6b7280" d="M375 245h10l-5 8Z"/><rect width="740" height="76" x="10" y="254" fill="#f3f4f6" stroke="#9ca3af" rx="8"/><text x="24" y="286" fill="#1f2937" font-size="14px" font-weight="700">3. Application</text><rect width="270" height="52" x="188" y="266" fill="#fff" stroke="#d1d5db" rx="6"/><text x="323" y="289" fill="#1f2937" font-size="12px" font-weight="400" text-anchor="middle">Uploads behind authentication</text><text x="323" y="306" fill="#1f2937" font-size="12px" font-weight="400" text-anchor="middle">and CSRF protection</text><rect width="270" height="52" x="470" y="266" fill="#fff" stroke="#d1d5db" rx="6"/><text x="605" y="289" fill="#1f2937" font-size="12px" font-weight="400" text-anchor="middle">Validate input, fail closed</text><text x="605" y="306" fill="#1f2937" font-size="12px" font-weight="400" text-anchor="middle">with a 4xx on bad bodies</text><path stroke="#6b7280" stroke-width="1.5" d="M380 330v16"/><path fill="#6b7280" d="M375 345h10l-5 8Z"/><rect width="740" height="76" x="10" y="354" fill="#fef3c7" stroke="#b45309" stroke-width="2" rx="8"/><text x="24" y="386" fill="#1f2937" font-size="14px" font-weight="700">4. PHP runtime</text><text x="24" y="406" fill="#4b5563" font-size="12px" font-weight="400">the actual fix</text><rect width="176" height="52" x="188" y="366" fill="#fde68a" stroke="#b45309" rx="6"/><text x="276" y="389" fill="#1f2937" font-size="12px" font-weight="700" text-anchor="middle">PATCH: 8.5.12, 8.4.27,</text><text x="276" y="406" fill="#1f2937" font-size="12px" font-weight="700" text-anchor="middle">8.3.36, 8.2.35</text><rect width="176" height="52" x="376" y="366" fill="#fff" stroke="#d1d5db" rx="6"/><text x="464" y="389" fill="#1f2937" font-size="12px" font-weight="400" text-anchor="middle">Interim and partial: ini</text><text x="464" y="406" fill="#1f2937" font-size="12px" font-weight="400" text-anchor="middle">changes, cgroup limit</text><rect width="176" height="52" x="564" y="366" fill="#fff" stroke="#d1d5db" rx="6"/><text x="652" y="389" fill="#1f2937" font-size="12px" font-weight="400" text-anchor="middle">Restart</text><text x="652" y="406" fill="#1f2937" font-size="12px" font-weight="400" text-anchor="middle">every worker</text><path stroke="#6b7280" stroke-width="1.5" d="M380 430v16"/><path fill="#6b7280" d="M375 445h10l-5 8Z"/><rect width="740" height="76" x="10" y="454" fill="#f3f4f6" stroke="#9ca3af" rx="8"/><text x="24" y="486" fill="#1f2937" font-size="14px" font-weight="700">5. Container / infra</text><text x="24" y="506" fill="#4b5563" font-size="12px" font-weight="400">blast radius</text><rect width="176" height="52" x="188" y="466" fill="#fff" stroke="#d1d5db" rx="6"/><text x="276" y="489" fill="#1f2937" font-size="12px" font-weight="400" text-anchor="middle">Rebuild without cache,</text><text x="276" y="506" fill="#1f2937" font-size="12px" font-weight="400" text-anchor="middle">pin tags and digests</text><rect width="176" height="52" x="376" y="466" fill="#fff" stroke="#d1d5db" rx="6"/><text x="464" y="489" fill="#1f2937" font-size="12px" font-weight="400" text-anchor="middle">Non-root, read-only FS,</text><text x="464" y="506" fill="#1f2937" font-size="12px" font-weight="400" text-anchor="middle">dropped capabilities</text><rect width="176" height="52" x="564" y="466" fill="#fff" stroke="#d1d5db" rx="6"/><text x="652" y="489" fill="#1f2937" font-size="12px" font-weight="400" text-anchor="middle">Memory limit, egress</text><text x="652" y="506" fill="#1f2937" font-size="12px" font-weight="400" text-anchor="middle">filter, scoped secrets</text><path stroke="#6b7280" stroke-width="1.5" d="M380 530v16"/><path fill="#6b7280" d="M375 545h10l-5 8Z"/><rect width="740" height="76" x="10" y="554" fill="#f3f4f6" stroke="#9ca3af" rx="8"/><text x="24" y="586" fill="#1f2937" font-size="14px" font-weight="700">6. Monitoring</text><text x="24" y="606" fill="#4b5563" font-size="12px" font-weight="400">every layer reports here</text><rect width="176" height="52" x="188" y="566" fill="#fff" stroke="#d1d5db" rx="6"/><text x="276" y="589" fill="#1f2937" font-size="12px" font-weight="400" text-anchor="middle">WAF events</text><text x="276" y="606" fill="#1f2937" font-size="12px" font-weight="400" text-anchor="middle">to the SIEM</text><rect width="176" height="52" x="376" y="566" fill="#fff" stroke="#d1d5db" rx="6"/><text x="464" y="589" fill="#1f2937" font-size="12px" font-weight="400" text-anchor="middle">Shells from workers,</text><text x="464" y="606" fill="#1f2937" font-size="12px" font-weight="400" text-anchor="middle">crashes, memory fatals</text><rect width="176" height="52" x="564" y="566" fill="#fff" stroke="#d1d5db" rx="6"/><text x="652" y="589" fill="#1f2937" font-size="12px" font-weight="400" text-anchor="middle">Runbook: review,</text><text x="652" y="606" fill="#1f2937" font-size="12px" font-weight="400" text-anchor="middle">deny, rotate secrets</text><text x="380" y="666" fill="#374151" font-size="13px" font-weight="600" text-anchor="middle">Only layer 4 removes the vulnerability. The others reduce exposure and limit damage.</text></svg>