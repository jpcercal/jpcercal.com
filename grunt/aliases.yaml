w:
  description: 'Watch'
  tasks:
    - 'watch'

main:
  description: 'Common tasks that will be executed independently of environment'
  tasks:
    - 'clean:dist'

default:
  description: 'Default task'
  tasks:
    - 'main'
    - 'shell:development'
    - 'processhtml:development'
    - 'notify_hooks'

production:
  description: 'Production task'
  tasks:
    - 'main'
    - 'shell:production'
    - 'processhtml:production'
    - 'clean:unminified'
    - 'clean:public-posts-directory'
    - 'notify_hooks'
