<svg xmlns="http://www.w3.org/2000/svg" width="760" height="684" viewBox="0 0 760 684" role="img" aria-labelledby="t d">
<title id="t">Camadas de defesa contra o PHP2Shell</title>
<desc id="d">Seis camadas empilhadas, da internet ao monitoramento: WAF de borda, proxy reverso, aplicação, runtime do PHP, contêiner e infraestrutura, e monitoramento. Só a camada do runtime do PHP, o patch, remove a vulnerabilidade.</desc>
<rect width="760" height="684" fill="#ffffff"/>
<style>text{font-family:Helvetica, Arial, sans-serif}</style>
<rect x="170" y="10" width="420" height="30" rx="15" fill="#fee2e2" stroke="#b91c1c"/>
<text x="380" y="30" font-size="13" font-weight="600" fill="#7f1d1d" text-anchor="middle">Cliente na internet: POSTs multipart sem autenticação</text>
<line x1="380" y1="40" x2="380" y2="46" stroke="#6b7280" stroke-width="1.5"/><polygon points="375,45 385,45 380,53" fill="#6b7280"/>
<rect x="10" y="54" width="740" height="76" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1"/>
<text x="24" y="86" font-size="14" font-weight="700" fill="#1f2937" text-anchor="start">1. Borda</text>
<text x="24" y="106" font-size="12" font-weight="400" fill="#4b5563" text-anchor="start">WAF (exemplo Akamai)</text>
<rect x="188.0" y="66" width="176.0" height="52" rx="6" fill="#ffffff" stroke="#d1d5db"/>
<text x="276.0" y="89" font-size="12" font-weight="400" fill="#1f2937" text-anchor="middle">Regras gerenciadas em Deny</text>
<text x="276.0" y="106" font-size="12" font-weight="400" fill="#1f2937" text-anchor="middle">ASE 3000991, cmd injection</text>
<rect x="376.0" y="66" width="176.0" height="52" rx="6" fill="#ffffff" stroke="#d1d5db"/>
<text x="464.0" y="89" font-size="12" font-weight="400" fill="#1f2937" text-anchor="middle">Patch virtual próprio</text>
<text x="464.0" y="106" font-size="12" font-weight="400" fill="#1f2937" text-anchor="middle">formato e tamanho do multipart</text>
<rect x="564.0" y="66" width="176.0" height="52" rx="6" fill="#ffffff" stroke="#d1d5db"/>
<text x="652.0" y="89" font-size="12" font-weight="400" fill="#1f2937" text-anchor="middle">Limites de taxa e trava</text>
<text x="652.0" y="106" font-size="12" font-weight="400" fill="#1f2937" text-anchor="middle">de acesso direto à origem</text>
<line x1="380" y1="130" x2="380" y2="146" stroke="#6b7280" stroke-width="1.5"/><polygon points="375,145 385,145 380,153" fill="#6b7280"/>
<rect x="10" y="154" width="740" height="76" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1"/>
<text x="24" y="186" font-size="14" font-weight="700" fill="#1f2937" text-anchor="start">2. Proxy / servidor web</text>
<text x="24" y="206" font-size="12" font-weight="400" fill="#4b5563" text-anchor="start">antes do PHP</text>
<rect x="188.0" y="166" width="176.0" height="52" rx="6" fill="#ffffff" stroke="#d1d5db"/>
<text x="276.0" y="189" font-size="12" font-weight="400" fill="#1f2937" text-anchor="middle">Limites rígidos: tamanho,</text>
<text x="276.0" y="206" font-size="12" font-weight="400" fill="#1f2937" text-anchor="middle">partes, headers, aninhamento</text>
<rect x="376.0" y="166" width="176.0" height="52" rx="6" fill="#ffffff" stroke="#d1d5db"/>
<text x="464.0" y="189" font-size="12" font-weight="400" fill="#1f2937" text-anchor="middle">Rejeitar multipart sem</text>
<text x="464.0" y="206" font-size="12" font-weight="400" fill="#1f2937" text-anchor="middle">Content-Length utilizável</text>
<rect x="564.0" y="166" width="176.0" height="52" rx="6" fill="#ffffff" stroke="#d1d5db"/>
<text x="652.0" y="189" font-size="12" font-weight="400" fill="#1f2937" text-anchor="middle">Multipart só nas rotas</text>
<text x="652.0" y="206" font-size="12" font-weight="400" fill="#1f2937" text-anchor="middle">que precisam dele</text>
<line x1="380" y1="230" x2="380" y2="246" stroke="#6b7280" stroke-width="1.5"/><polygon points="375,245 385,245 380,253" fill="#6b7280"/>
<rect x="10" y="254" width="740" height="76" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1"/>
<text x="24" y="286" font-size="14" font-weight="700" fill="#1f2937" text-anchor="start">3. Aplicação</text>

<rect x="188.0" y="266" width="270.0" height="52" rx="6" fill="#ffffff" stroke="#d1d5db"/>
<text x="323.0" y="289" font-size="12" font-weight="400" fill="#1f2937" text-anchor="middle">Uploads só com autenticação</text>
<text x="323.0" y="306" font-size="12" font-weight="400" fill="#1f2937" text-anchor="middle">e proteção contra CSRF</text>
<rect x="470.0" y="266" width="270.0" height="52" rx="6" fill="#ffffff" stroke="#d1d5db"/>
<text x="605.0" y="289" font-size="12" font-weight="400" fill="#1f2937" text-anchor="middle">Validar a entrada e falhar fechado</text>
<text x="605.0" y="306" font-size="12" font-weight="400" fill="#1f2937" text-anchor="middle">com 4xx em corpos inválidos</text>
<line x1="380" y1="330" x2="380" y2="346" stroke="#6b7280" stroke-width="1.5"/><polygon points="375,345 385,345 380,353" fill="#6b7280"/>
<rect x="10" y="354" width="740" height="76" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
<text x="24" y="386" font-size="14" font-weight="700" fill="#1f2937" text-anchor="start">4. Runtime do PHP</text>
<text x="24" y="406" font-size="12" font-weight="400" fill="#4b5563" text-anchor="start">a correção de fato</text>
<rect x="188.0" y="366" width="176.0" height="52" rx="6" fill="#fde68a" stroke="#b45309"/>
<text x="276.0" y="389" font-size="12" font-weight="700" fill="#1f2937" text-anchor="middle">PATCH: 8.5.12, 8.4.27,</text>
<text x="276.0" y="406" font-size="12" font-weight="700" fill="#1f2937" text-anchor="middle">8.3.36, 8.2.35</text>
<rect x="376.0" y="366" width="176.0" height="52" rx="6" fill="#ffffff" stroke="#d1d5db"/>
<text x="464.0" y="389" font-size="12" font-weight="400" fill="#1f2937" text-anchor="middle">Provisório e parcial: ini,</text>
<text x="464.0" y="406" font-size="12" font-weight="400" fill="#1f2937" text-anchor="middle">limite de cgroup</text>
<rect x="564.0" y="366" width="176.0" height="52" rx="6" fill="#ffffff" stroke="#d1d5db"/>
<text x="652.0" y="389" font-size="12" font-weight="400" fill="#1f2937" text-anchor="middle">Reiniciar</text>
<text x="652.0" y="406" font-size="12" font-weight="400" fill="#1f2937" text-anchor="middle">todos os workers</text>
<line x1="380" y1="430" x2="380" y2="446" stroke="#6b7280" stroke-width="1.5"/><polygon points="375,445 385,445 380,453" fill="#6b7280"/>
<rect x="10" y="454" width="740" height="76" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1"/>
<text x="24" y="486" font-size="14" font-weight="700" fill="#1f2937" text-anchor="start">5. Contêiner / infra</text>
<text x="24" y="506" font-size="12" font-weight="400" fill="#4b5563" text-anchor="start">raio de impacto</text>
<rect x="188.0" y="466" width="176.0" height="52" rx="6" fill="#ffffff" stroke="#d1d5db"/>
<text x="276.0" y="489" font-size="12" font-weight="400" fill="#1f2937" text-anchor="middle">Rebuild sem cache,</text>
<text x="276.0" y="506" font-size="12" font-weight="400" fill="#1f2937" text-anchor="middle">fixar tags e digests</text>
<rect x="376.0" y="466" width="176.0" height="52" rx="6" fill="#ffffff" stroke="#d1d5db"/>
<text x="464.0" y="489" font-size="12" font-weight="400" fill="#1f2937" text-anchor="middle">Non-root, FS somente leitura,</text>
<text x="464.0" y="506" font-size="12" font-weight="400" fill="#1f2937" text-anchor="middle">capabilities removidas</text>
<rect x="564.0" y="466" width="176.0" height="52" rx="6" fill="#ffffff" stroke="#d1d5db"/>
<text x="652.0" y="489" font-size="12" font-weight="400" fill="#1f2937" text-anchor="middle">Limite de memória, filtro</text>
<text x="652.0" y="506" font-size="12" font-weight="400" fill="#1f2937" text-anchor="middle">de egress, segredos restritos</text>
<line x1="380" y1="530" x2="380" y2="546" stroke="#6b7280" stroke-width="1.5"/><polygon points="375,545 385,545 380,553" fill="#6b7280"/>
<rect x="10" y="554" width="740" height="76" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1"/>
<text x="24" y="586" font-size="14" font-weight="700" fill="#1f2937" text-anchor="start">6. Monitoramento</text>
<text x="24" y="606" font-size="12" font-weight="400" fill="#4b5563" text-anchor="start">toda camada reporta aqui</text>
<rect x="188.0" y="566" width="176.0" height="52" rx="6" fill="#ffffff" stroke="#d1d5db"/>
<text x="276.0" y="589" font-size="12" font-weight="400" fill="#1f2937" text-anchor="middle">Eventos do WAF</text>
<text x="276.0" y="606" font-size="12" font-weight="400" fill="#1f2937" text-anchor="middle">para o SIEM</text>
<rect x="376.0" y="566" width="176.0" height="52" rx="6" fill="#ffffff" stroke="#d1d5db"/>
<text x="464.0" y="589" font-size="12" font-weight="400" fill="#1f2937" text-anchor="middle">Shells em workers,</text>
<text x="464.0" y="606" font-size="12" font-weight="400" fill="#1f2937" text-anchor="middle">crashes, fatais de memória</text>
<rect x="564.0" y="566" width="176.0" height="52" rx="6" fill="#ffffff" stroke="#d1d5db"/>
<text x="652.0" y="589" font-size="12" font-weight="400" fill="#1f2937" text-anchor="middle">Runbook: revisar, negar,</text>
<text x="652.0" y="606" font-size="12" font-weight="400" fill="#1f2937" text-anchor="middle">rotacionar segredos</text>
<text x="380" y="666" font-size="13" font-weight="600" fill="#374151" text-anchor="middle">Só a camada 4 remove a vulnerabilidade. As outras reduzem a exposição e limitam o dano.</text>
</svg>
