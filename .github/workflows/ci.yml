name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

env:
  HUGO_VERSION: 0.166.0
  NODE_VERSION: "24"
  BASE_URL: https://jpcercal.com/
  STAGING_HOST: https://staging.jpcercal.com
  CLOUDFLARE_PROJECT_NAME: jpcercal-dot-com
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/jpcercal/jpcercal.com-ci

jobs:
  image:
    name: CI image (GHCR)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Always runs first (every other job needs it): with a warm Buildx GHA
      # cache this is a seconds-long no-op (no compilation) when the
      # Dockerfile is untouched; when it is touched the rebuild+push lands
      # before any downstream job starts, pinned by commit SHA below.
      - name: Build and push CI image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/jpcercal/jpcercal.com-ci:latest
            ghcr.io/jpcercal/jpcercal.com-ci:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: image
    permissions:
      contents: read
      packages: read
    container:
      image: ghcr.io/jpcercal/jpcercal.com-ci:${{ github.sha }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # node_modules is baked into the image (/opt/ci); linking is instant
      # and no npm install runs in any job.
      - name: Link baked dependencies (zero-install)
        run: |
          ln -s /opt/ci/node_modules node_modules
          node --version
          hugo version

      - name: Production build
        run: npm run build

      - name: Build images (native pipeline)
        run: bin/build-images.sh

      - name: Index search (Pagefind)
        run: pagefind --site public

      - name: Lint (Biome)
        run: npm run lint

      - name: Validate HTML
        run: npm run validate:html

      - name: Validate XML/SVG
        run: npm run validate:xml

      - name: Check links (lychee)
        # Remap prod URLs to the fresh local build (absolute path required;
        # without it lychee checks stale prod and 404s on new routes).
        # NOTE: $PWD, not ${{ github.workspace }} — inside the container the
        # workspace lives at /__w/... while the expression yields the host
        # path (/home/runner/work/...), which does not exist in the container.
        run: lychee --config .lychee.toml --no-progress --remap "https://jpcercal.com file://$PWD/public" "public/**/index.html"

      - name: Upload site artifact
        uses: actions/upload-artifact@v4
        with:
          name: public
          path: public
          retention-days: 7

  preview-staging:
    name: Preview on staging (gh-pages, PR path)
    runs-on: ubuntu-latest
    needs: build
    # PRs only — never touches the Cloudflare Pages project or production.
    if: github.event_name == 'pull_request'
    permissions:
      contents: write
      packages: read
    container:
      image: ghcr.io/jpcercal/jpcercal.com-ci:${{ github.sha }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      # NOTE: job-level env cannot use ${{ env.* }} (GitHub validation
      # rejects it), so the staging host is hardcoded here to match
      # top-level STAGING_HOST.
      PR_BASE_URL: https://staging.jpcercal.com/pr-${{ github.event.number }}/
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Link baked dependencies (zero-install)
        run: |
          ln -s /opt/ci/node_modules node_modules
          node --version
          hugo version

      - name: Staging build (drafts + design system + PR baseURL)
        # design-system/ lives outside content/ so it can never leak to
        # prod; staging copies it in and builds drafts (same split the
        # old grunt-shell dev/prod builds had).
        # NOTE: Hugo Pipes (Dart Sass, TailwindCSS) resolves binaries via
        # node_modules/.bin on PATH — npm scripts provide it automatically,
        # but this step calls hugo directly, so export it explicitly.
        run: |
          export PATH="$PWD/node_modules/.bin:$PATH"
          cp -r design-system content/design-system
          hugo --buildDrafts --minify --baseURL "$PR_BASE_URL"
          bin/build-images.sh
          pagefind --site public
          # The prod CNAME (jpcercal.com) must never ship to staging.
          rm -f public/CNAME

      - name: Staging presence check (non-blocking)
        continue-on-error: true
        run: |
          test -f public/index.html
          test -f public/design-system/index.html
          test ! -f public/CNAME

      - name: Publish PR path to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages
          destination_dir: pr-${{ github.event.number }}
          keep_files: true
          # Custom domain for the staging branch (apex stays on Pages).
          cname: staging.jpcercal.com

  deploy:
    name: Deploy to Cloudflare Pages (prod)
    runs-on: ubuntu-latest
    needs: build
    # Only deploy from master pushes, never from PRs.
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Download site artifact
        uses: actions/download-artifact@v4
        with:
          name: public
          path: public

      - name: List Pages projects (diagnostic)
        # Shows which projects the API token can see; deploy below 404s
        # (8000007) when the project is absent here. No explicit accountId:
        # the token sees a single account, so wrangler uses it by default.
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: pages project list

      - name: Publish with Wrangler (Direct Upload, no build quota)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: pages deploy public --project-name=${{ env.CLOUDFLARE_PROJECT_NAME }} --commit-dirty=true

  cloudflare-pages:
    name: Verify Cloudflare Pages (prod, blocking)
    runs-on: ubuntu-latest
    needs: deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    permissions:
      contents: read
      packages: read
    container:
      image: ghcr.io/jpcercal/jpcercal.com-ci:${{ github.sha }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout (verify script + configs)
        uses: actions/checkout@v4

      - name: Link baked dependencies (zero-install)
        run: |
          ln -s /opt/ci/node_modules node_modules
          node --version

      # LHCI runs as root in the container, so Chrome needs --no-sandbox;
      # verify-pages.sh forwards LHCI_CHROME_FLAGS for exactly this case
      # (unset locally, where the sandbox stays on).
      - name: Resolve baked Chromium for LHCI
        run: echo "CHROME_PATH=$(node -p "require('@playwright/test').chromium.executablePath()")" >> "$GITHUB_ENV"

      - name: Run Pages verification suite
        run: bin/verify-pages.sh
        env:
          BASE_URL: ${{ env.BASE_URL }}
          CHROME_PATH: ${{ env.CHROME_PATH }}
          LHCI_CHROME_FLAGS: "--no-sandbox --disable-dev-shm-usage"
