name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

env:
  HUGO_VERSION: 0.166.0
  NODE_VERSION: "24"
  BASE_URL: https://jpcercal.com/

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: ${{ env.HUGO_VERSION }}
          extended: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Setup Rust (for oxipng/oxvg/resvg)
        uses: dtolnay/rust-toolchain@stable

      - name: Install native image tools
        # oxipng (PNG) + oxvg (SVG) + resvg (SVG->PNG covers) via cargo;
        # mozjpeg (JPEG) has no apt/cargo binary, so build from source.
        run: |
          cargo install oxipng oxvg resvg pagefind
          sudo apt-get update && sudo apt-get install -y --no-install-recommends nasm cmake
          curl -fLO https://github.com/mozilla/mozjpeg/archive/v4.1.5.tar.gz
          tar xf v4.1.5.tar.gz
          cmake -B mozjpeg-4.1.5/build -DCMAKE_INSTALL_PREFIX=/usr/local mozjpeg-4.1.5
          cmake --build mozjpeg-4.1.5/build -j
          sudo cmake --install mozjpeg-4.1.5/build
          /usr/local/bin/jpegtran -version

      - name: Install npm dependencies
        run: npm ci --no-audit --no-fund

      - name: Fetch vendor sources
        # Replaces `npm run napa`, which clones over the retired git://
        # protocol and can no longer connect to GitHub.
        run: bin/fetch-vendor.sh

      - name: Production build
        run: npx grunt production

      - name: Build images (native pipeline)
        run: bin/build-images.sh

      - name: Index search (Pagefind)
        run: pagefind --site public

      - name: Upload site artifact
        uses: actions/upload-artifact@v4
        with:
          name: public
          path: public
          retention-days: 7

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build
    # Only deploy from master pushes, never from PRs.
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    permissions:
      contents: write
    steps:
      - name: Download site artifact
        uses: actions/download-artifact@v4
        with:
          name: public
          path: public

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages
