name: CI (main)

# Full production pipeline: runs only when a PR is merged (push to main) or when
# the dependency-lock bot dispatches it. Pull requests are handled by the
# separate PR preview workflow, so no pull_request trigger belongs here.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      pull_request_number:
        description: PR number for bot-dispatched CI and staging (empty for a manual build)
        type: string
        default: ""

env:
  BASE_URL: https://jpcercal.com/
  STAGING_HOST: https://staging.jpcercal.com
  CLOUDFLARE_PROJECT_NAME: jpcercal-dot-com
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/jpcercal/jpcercal.com-ci

defaults:
  run:
    # BASH_ENV loads the flake-generated configuration in non-login CI steps.
    shell: bash

jobs:
  image:
    name: CI image (GHCR)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      digest: ${{ steps.image.outputs.digest }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The Dockerfile builds and checks the locked Nix toolchain. Downstream
      # jobs consume the immutable digest, not a mutable tag or a second install.
      - name: Build and push CI image
        id: image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          # The mutable :latest tag feeds the PR preview fast path, so only
          # main may move it; PR runs push the immutable :<sha> tag only.
          tags: |
            ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'ghcr.io/jpcercal/jpcercal.com-ci:latest' || '' }}
            ghcr.io/jpcercal/jpcercal.com-ci:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: image
    permissions:
      contents: read
      packages: read
    container:
      image: ghcr.io/jpcercal/jpcercal.com-ci@${{ needs.image.outputs.digest }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # node_modules is baked into the image (/opt/ci); linking is instant
      # and no npm install runs in any job.
      - name: Link baked dependencies (zero-install)
        run: |
          ln -s /opt/ci/node_modules node_modules
          node --version
          hugo version

      - name: Dependency updater safety tests
        run: python3 -m unittest discover -s tests -v

      - name: Playwright smoke tests
        # Playwright builds with localhost URLs; the production build below
        # cleans that output before the deployable artifact is produced.
        run: npm run e2e -- e2e/smoke.spec.js

      - name: Preserve browser traces on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: test-results
          retention-days: 7

      - name: Production build
        run: npm run build

      - name: Build images (native pipeline)
        run: bin/build-images.sh

      - name: Index search (Pagefind)
        run: npm run search:index

      - name: Lint (Biome)
        run: npm run lint

      - name: Validate HTML
        run: npm run validate:html

      - name: Validate XML/SVG
        run: npm run validate:xml

      - name: Check links (lychee)
        # Remap prod URLs to the fresh local build (absolute path required;
        # without it lychee checks stale prod and 404s on new routes).
        # NOTE: $PWD, not ${{ github.workspace }} — inside the container the
        # workspace lives at /__w/... while the expression yields the host
        # path (/home/runner/work/...), which does not exist in the container.
        run: lychee --config .lychee.toml --no-progress --remap "https://jpcercal.com file://$PWD/public" "public/**/index.html"

      - name: Check production artifact isolation
        run: bin/check-artifact.sh

      - name: Lighthouse CI
        # Rootful containers need this flag; normal local shells keep sandboxing.
        run: |
          # Checkout's temporary Git config is not shared with shell steps.
          # Trust only this container path, including LHCI's Git subprocesses.
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=safe.directory
          export GIT_CONFIG_VALUE_0="$PWD"
          git rev-list --no-merges -n1 HEAD
          npm run lhci -- --collect.settings.chromeFlags="--no-sandbox --disable-dev-shm-usage"

      - name: Preserve Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-reports
          path: .lighthouseci
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload site artifact
        uses: actions/upload-artifact@v7
        with:
          name: public
          path: public
          retention-days: 7

  preview-staging:
    name: Preview on staging (gh-pages, PR path)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [build, image]
    # Bot-dispatched PRs only (GITHUB_TOKEN commits do not fire pull_request).
    # Regular PR previews are published by pr-preview.yml. Never touches the
    # Cloudflare Pages project or production.
    if: github.event_name == 'workflow_dispatch' && inputs.pull_request_number != ''
    permissions:
      contents: write
      packages: read
    container:
      image: ghcr.io/jpcercal/jpcercal.com-ci@${{ needs.image.outputs.digest }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      # NOTE: job-level env cannot use ${{ env.* }} (GitHub validation
      # rejects it), so the staging host is hardcoded here to match
      # top-level STAGING_HOST.
      PR_BASE_URL: https://staging.jpcercal.com/pr-${{ inputs.pull_request_number }}/
    steps:
      # GITHUB_TOKEN commits suppress push/PR workflows, so the lock updater
      # explicitly dispatches CI on the bot branch. Verify that dispatch points
      # at the stated same-repository PR before publishing anything to staging.
      - name: Verify dispatched PR context
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ inputs.pull_request_number }}
          REPOSITORY: ${{ github.repository }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/$REPOSITORY/pulls/$PR_NUMBER" > /tmp/dispatched-pr.json
          python3 - <<'PY'
          import json, os
          with open('/tmp/dispatched-pr.json') as handle:
              pr = json.load(handle)
          assert pr['state'] == 'open'
          assert pr['base']['ref'] == 'main'
          assert pr['head']['repo']['full_name'] == os.environ['REPOSITORY']
          assert pr['head']['sha'] == os.environ['HEAD_SHA']
          PY

      - name: Checkout
        uses: actions/checkout@v7

      - name: Link baked dependencies (zero-install)
        run: |
          ln -s /opt/ci/node_modules node_modules
          node --version
          hugo version

      - name: Staging build (drafts + design system + PR baseURL)
        # design-system/ lives outside content/ so it can never leak to
        # prod; staging copies it in and builds drafts (same split the
        # old grunt-shell dev/prod builds had).
        # NOTE: Hugo Pipes (Dart Sass, TailwindCSS) resolves binaries via
        # node_modules/.bin on PATH — npm scripts provide it automatically,
        # but this step calls hugo directly, so export it explicitly.
        run: |
          export PATH="$PWD/node_modules/.bin:$PATH"
          cp -r design-system content/design-system
          hugo --buildDrafts --minify --baseURL "$PR_BASE_URL"
          bin/build-images.sh
          npm run search:index
          # The prod CNAME (jpcercal.com) must never ship to staging.
          rm -f public/CNAME

      - name: Staging presence check (non-blocking)
        continue-on-error: true
        run: |
          test -f public/index.html
          test -f public/design-system/index.html
          test ! -f public/CNAME

      - name: Publish PR path to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages
          destination_dir: pr-${{ inputs.pull_request_number }}
          keep_files: true
          # Custom domain for the staging branch (apex stays on Pages).
          cname: staging.jpcercal.com

  deploy:
    name: Deploy to Cloudflare Pages (prod)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Serialize production deploys: a slower older run must never publish over
    # a newer one. Never cancel a running deploy (half-uploaded is worse); GitHub
    # keeps only the newest pending run, so the latest commit still wins.
    concurrency:
      group: cloudflare-pages-production
      cancel-in-progress: false
    needs: [build, image]
    # Only deploy from main pushes, never from PRs.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      deployments: write
      packages: read
    container:
      image: ghcr.io/jpcercal/jpcercal.com-ci@${{ needs.image.outputs.digest }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Link pinned dependencies
        run: ln -s /opt/ci/node_modules node_modules

      - name: Download site artifact
        uses: actions/download-artifact@v8
        with:
          name: public
          path: public

      - name: Publish with Wrangler (Direct Upload, no build quota)
        # The Pages project must already exist (create it once in the Cloudflare
        # dashboard or with `wrangler pages project create`). A missing project or
        # a bad token now fails here with the real Cloudflare error instead of
        # being hidden by a swallowed "create project" step.
        # Commit metadata is passed explicitly because the container checkout is
        # not guaranteed to be readable by Wrangler's git detection; it makes
        # deployments identifiable (and rollbackable) in the dashboard.
        env:
          COMMIT_SHA: ${{ github.sha }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          test -f public/index.html
          wrangler pages deploy public \
            --project-name="$CLOUDFLARE_PROJECT_NAME" \
            --branch=main \
            --commit-hash="$COMMIT_SHA" \
            --commit-message="$(printf '%s' "$COMMIT_MESSAGE" | head -n1 | cut -c1-100)" \
            --commit-dirty=true

  cloudflare-pages:
    name: Verify Cloudflare Pages (prod, blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [deploy, image]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: read
    container:
      image: ghcr.io/jpcercal/jpcercal.com-ci@${{ needs.image.outputs.digest }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout (verify script + configs)
        uses: actions/checkout@v7

      - name: Link baked dependencies (zero-install)
        run: |
          ln -s /opt/ci/node_modules node_modules
          node --version

      # LHCI runs as root in the container, so Chrome needs --no-sandbox;
      # verify-pages.sh forwards LHCI_CHROME_FLAGS for exactly this case
      # (unset locally, where the sandbox stays on).
      - name: Run Pages verification suite
        run: bin/verify-pages.sh
        env:
          BASE_URL: ${{ env.BASE_URL }}
          LHCI_CHROME_FLAGS: "--no-sandbox --disable-dev-shm-usage"
