{{- $f := partial "footer/links.html" . -}}
<footer class="site-footer site-footer--compact">
    <div class="container">
        <div class="row">
            <div class="col offset-lg-1 offset-xl-2 col-lg-10 col-xl-8">
                <div class="site-footer--inner flex flex-wrap items-center justify-between gap-2">
                    <p class="site-footer--copy m-0">&copy; {{ $f.year }} <a href="{{ $f.home }}">{{ $f.title }}</a></p>
                    <nav aria-label='{{ i18n "footerNav" }}'>
                        <ul class="site-footer--links list-none flex flex-wrap gap-2 m-0">
                            {{- range $f.nav }}
                            <li><a href="{{ .url }}">{{ .label }}</a></li>
                            {{- end }}
                            {{- with $f.rss }}
                            <li><a href="{{ . }}" rel="alternate" type="application/rss+xml">RSS</a></li>
                            {{- end }}
                        </ul>
                    </nav>
                </div>
            </div>
        </div>
    </div>
</footer>
