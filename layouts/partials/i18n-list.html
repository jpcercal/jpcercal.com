{{ if .IsTranslated }}
    <h2 class="font-size-h4 mb-2">{{ i18n "translations" }}</h2>
    <ul>
        {{ range $translatedPost := .Translations }}
            <li>
                <a href="{{ .Permalink }}">{{ i18n $translatedPost.Lang }}: {{ $translatedPost.Title }}</a>
            </li>
        {{ end }}
    </ul>
{{ end }}
