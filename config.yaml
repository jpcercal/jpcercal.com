archetypeDir: "archetypes"
contentDir:   "content"
layoutDir:    "layouts"
publishDir:   "public"
dataDir:      "data"
staticDir:    "static"

taxonomies:
  tag:        "tags"
  category:   "categories"
  authors:    "authors"

params:
  # Cloudflare Web Analytics token (public client-side ID). Empty until the
  # site is registered in the Cloudflare dashboard; the beacon partial
  # renders nothing while this is empty. Prod hostname gate lives in the
  # partial so staging/local/e2e builds never emit the beacon.
  cloudflareWebAnalyticsToken: "15a0ea1b52c8410080a89ee3bc64156e"

markup:
  highlight:
    style:        "onedark"
    noClasses:    false
    guessSyntax:  false
    lineNos:      true
    lineNumbersInTable: true
    tabWidth:     4

defaultContentLanguage: "pt"
defaultContentLanguageInSubdir: false
enableMissingTranslationPlaceholders: false

languages:
  en:
    title: "jpcercal.com"
    locale: "en"
    description: "High quality and variety of subjects, including tips from programming to lifestyle but written in our style and we are not talking about CSS."
    params:
      description: "High quality and variety of subjects, including tips from programming to lifestyle but written in our style and we are not talking about CSS."
  pt:
    title: "jpcercal.com"
    locale: "pt"
    description: "Alta qualidade e variedade de assuntos, incluindo desde dicas de programação à estilo de vida, mas no nosso estilo e não estamos falando de CSS."
    params:
      description: "Alta qualidade e variedade de assuntos, incluindo desde dicas de programação à estilo de vida, mas no nosso estilo e não estamos falando de CSS."

pagination:
  pagerSize: 10
  path: "page"

services:
  rss:
    limit: 15

permalinks:
  posts:   /:slug/
  authors: /authors/:slug/

noChmod:      false
noTimes:      false
buildFuture:  false
buildExpired: false
relativeURLs: false
canonifyURLs: false

disablePathToLower:         false
watch:                      true
enableRobotsTXT:            true
disableHugoGeneratorInject: true
enableEmoji:                false

security:
  exec:
    allow:
      - "^(dart-)?sass$"
      - "^go$"
      - "^git$"
      - "^node$"
      - "^postcss$"
      - "^tailwindcss$"

ignoreFiles:
  - "Thumbs\\.db$"
  - "\\.DS_Store$"
  - "\\.log$"
  - "\\.lock$"
  - "\\.sw?$"