archetypeDir: "archetypes"
contentDir:   "content"
layoutDir:    "layouts"
publishDir:   "public"
dataDir:      "data"
staticDir:    "static"

taxonomies:
  tag:        "tags"
  category:   "categories"
  authors:    "authors"

params:
  # Cloudflare Web Analytics token (public client-side ID). Empty until the
  # site is registered in the Cloudflare dashboard; the beacon partial
  # renders nothing while this is empty. Prod hostname gate lives in the
  # partial so staging/local/e2e builds never emit the beacon.
  cloudflareWebAnalyticsToken: "15a0ea1b52c8410080a89ee3bc64156e"

defaultExtension: "html"
metaDataFormat:   "yaml"
markup:
  highlight:
    style:        "onedark"
    noClasses:    false
    guessSyntax:  false
    lineNos:      true
    lineNumbersInTable: true
    tabWidth:     4

defaultContentLanguage: "pt"
defaultContentLanguageInSubdir: false
enableMissingTranslationPlaceholders: false

languages:
  en:
    title: "jpcercal.com"
    locale: "en"
    description: "High quality and variety of subjects, including tips from programming to lifestyle but written in our style and we are not talking about CSS."
    params:
      description: "High quality and variety of subjects, including tips from programming to lifestyle but written in our style and we are not talking about CSS."
  pt:
    title: "jpcercal.com"
    locale: "pt"
    description: "Alta qualidade e variedade de assuntos, incluindo desde dicas de programação à estilo de vida, mas no nosso estilo e não estamos falando de CSS."
    params:
      description: "Alta qualidade e variedade de assuntos, incluindo desde dicas de programação à estilo de vida, mas no nosso estilo e não estamos falando de CSS."

rssLimit: 15
paginate: 10
paginatePath: "page"

# Post covers: the source svgs are pixel-traces whose <img> payload is
# dominated by thousands of 1px subpaths (brotli already collapses those,
# so oxvg gains little). Covers whose source svg is at least
# coverRasterMinBytes are also rendered to a 128px raster thumbnail
# (index.cover.png / index.dark.cover.png) and served as <img>: the
# brotli'd svg is the smaller payload below this size, so lighter covers
# keep shipping as svg. This key is the single source of truth —
# bin/build-images.sh (renders the rasters) and the post-card/single
# templates (choose the src) both read it.
params:
  coverRasterMinBytes: 16384

permalinks:
  posts:   /:slug/
  authors: /authors/:slug/

stepAnalysis: true
noChmod:      false
noTimes:      false
buildFuture:  false
buildExpired: false
relativeURLs: false
canonifyURLs: false

logFile:      "hugo.log"
log:          true
verbose:      false
verboseLog:   true

disablePathToLower:         false
watch:                      true
enableRobotsTXT:            true
disableHugoGeneratorInject: true
enableEmoji:                false

security:
  exec:
    allow:
      - "^(dart-)?sass$"
      - "^go$"
      - "^git$"
      - "^node$"
      - "^postcss$"
      - "^tailwindcss$"

footnoteAnchorPrefix:       ""
footnoteReturnLinkContents: ""

ignoreFiles: 
  - "Thumbs\\.db$"
  - "\\.DS_Store$"
  - "\\.log$"
  - "\\.lock$"
  - "\\.sw?$"
