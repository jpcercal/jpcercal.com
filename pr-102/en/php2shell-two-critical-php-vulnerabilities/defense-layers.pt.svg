<svg xmlns="http://www.w3.org/2000/svg" width="760" height="684" aria-labelledby="t d" viewBox="0 0 760 684"><title id="t">Camadas de defesa contra o PHP2Shell</title><desc id="d">Seis camadas empilhadas, da internet ao monitoramento: WAF de borda, proxy reverso, aplicação, runtime do PHP, contêiner e infraestrutura, e monitoramento. Só a camada do runtime do PHP, o patch, remove a vulnerabilidade.</desc><path fill="#fff" d="M0 0h760v684H0Z"/><style>text{font-family:Helvetica,Arial,sans-serif}</style><rect width="420" height="30" x="170" y="10" fill="#fee2e2" stroke="#b91c1c" rx="15"/><text x="380" y="30" fill="#7f1d1d" font-size="13px" font-weight="600" text-anchor="middle">Cliente na internet: POSTs multipart sem autenticação</text><path stroke="#6b7280" stroke-width="1.5" d="M380 40v6"/><path fill="#6b7280" d="M375 45h10l-5 8Z"/><rect width="740" height="76" x="10" y="54" fill="#f3f4f6" stroke="#9ca3af" rx="8"/><text x="24" y="86" fill="#1f2937" font-size="14px" font-weight="700">1. Borda</text><text x="24" y="106" fill="#4b5563" font-size="12px" font-weight="400">WAF (exemplo Akamai)</text><rect width="176" height="52" x="188" y="66" fill="#fff" stroke="#d1d5db" rx="6"/><text x="276" y="89" fill="#1f2937" font-size="12px" font-weight="400" text-anchor="middle">Regras gerenciadas em Deny</text><text x="276" y="106" fill="#1f2937" font-size="12px" font-weight="400" text-anchor="middle">ASE 3000991, cmd injection</text><rect width="176" height="52" x="376" y="66" fill="#fff" stroke="#d1d5db" rx="6"/><text x="464" y="89" fill="#1f2937" font-size="12px" font-weight="400" text-anchor="middle">Patch virtual próprio</text><text x="464" y="106" fill="#1f2937" font-size="12px" font-weight="400" text-anchor="middle">formato e tamanho do multipart</text><rect width="176" height="52" x="564" y="66" fill="#fff" stroke="#d1d5db" rx="6"/><text x="652" y="89" fill="#1f2937" font-size="12px" font-weight="400" text-anchor="middle">Limites de taxa e trava</text><text x="652" y="106" fill="#1f2937" font-size="12px" font-weight="400" text-anchor="middle">de acesso direto à origem</text><path stroke="#6b7280" stroke-width="1.5" d="M380 130v16"/><path fill="#6b7280" d="M375 145h10l-5 8Z"/><rect width="740" height="76" x="10" y="154" fill="#f3f4f6" stroke="#9ca3af" rx="8"/><text x="24" y="186" fill="#1f2937" font-size="14px" font-weight="700">2. Proxy / servidor web</text><text x="24" y="206" fill="#4b5563" font-size="12px" font-weight="400">antes do PHP</text><rect width="176" height="52" x="188" y="166" fill="#fff" stroke="#d1d5db" rx="6"/><text x="276" y="189" fill="#1f2937" font-size="12px" font-weight="400" text-anchor="middle">Limites rígidos: tamanho,</text><text x="276" y="206" fill="#1f2937" font-size="12px" font-weight="400" text-anchor="middle">partes, headers, aninhamento</text><rect width="176" height="52" x="376" y="166" fill="#fff" stroke="#d1d5db" rx="6"/><text x="464" y="189" fill="#1f2937" font-size="12px" font-weight="400" text-anchor="middle">Rejeitar multipart sem</text><text x="464" y="206" fill="#1f2937" font-size="12px" font-weight="400" text-anchor="middle">Content-Length utilizável</text><rect width="176" height="52" x="564" y="166" fill="#fff" stroke="#d1d5db" rx="6"/><text x="652" y="189" fill="#1f2937" font-size="12px" font-weight="400" text-anchor="middle">Multipart só nas rotas</text><text x="652" y="206" fill="#1f2937" font-size="12px" font-weight="400" text-anchor="middle">que precisam dele</text><path stroke="#6b7280" stroke-width="1.5" d="M380 230v16"/><path fill="#6b7280" d="M375 245h10l-5 8Z"/><rect width="740" height="76" x="10" y="254" fill="#f3f4f6" stroke="#9ca3af" rx="8"/><text x="24" y="286" fill="#1f2937" font-size="14px" font-weight="700">3. Aplicação</text><rect width="270" height="52" x="188" y="266" fill="#fff" stroke="#d1d5db" rx="6"/><text x="323" y="289" fill="#1f2937" font-size="12px" font-weight="400" text-anchor="middle">Uploads só com autenticação</text><text x="323" y="306" fill="#1f2937" font-size="12px" font-weight="400" text-anchor="middle">e proteção contra CSRF</text><rect width="270" height="52" x="470" y="266" fill="#fff" stroke="#d1d5db" rx="6"/><text x="605" y="289" fill="#1f2937" font-size="12px" font-weight="400" text-anchor="middle">Validar a entrada e falhar fechado</text><text x="605" y="306" fill="#1f2937" font-size="12px" font-weight="400" text-anchor="middle">com 4xx em corpos inválidos</text><path stroke="#6b7280" stroke-width="1.5" d="M380 330v16"/><path fill="#6b7280" d="M375 345h10l-5 8Z"/><rect width="740" height="76" x="10" y="354" fill="#fef3c7" stroke="#b45309" stroke-width="2" rx="8"/><text x="24" y="386" fill="#1f2937" font-size="14px" font-weight="700">4. Runtime do PHP</text><text x="24" y="406" fill="#4b5563" font-size="12px" font-weight="400">a correção de fato</text><rect width="176" height="52" x="188" y="366" fill="#fde68a" stroke="#b45309" rx="6"/><text x="276" y="389" fill="#1f2937" font-size="12px" font-weight="700" text-anchor="middle">PATCH: 8.5.12, 8.4.27,</text><text x="276" y="406" fill="#1f2937" font-size="12px" font-weight="700" text-anchor="middle">8.3.36, 8.2.35</text><rect width="176" height="52" x="376" y="366" fill="#fff" stroke="#d1d5db" rx="6"/><text x="464" y="389" fill="#1f2937" font-size="12px" font-weight="400" text-anchor="middle">Provisório e parcial: ini,</text><text x="464" y="406" fill="#1f2937" font-size="12px" font-weight="400" text-anchor="middle">limite de cgroup</text><rect width="176" height="52" x="564" y="366" fill="#fff" stroke="#d1d5db" rx="6"/><text x="652" y="389" fill="#1f2937" font-size="12px" font-weight="400" text-anchor="middle">Reiniciar</text><text x="652" y="406" fill="#1f2937" font-size="12px" font-weight="400" text-anchor="middle">todos os workers</text><path stroke="#6b7280" stroke-width="1.5" d="M380 430v16"/><path fill="#6b7280" d="M375 445h10l-5 8Z"/><rect width="740" height="76" x="10" y="454" fill="#f3f4f6" stroke="#9ca3af" rx="8"/><text x="24" y="486" fill="#1f2937" font-size="14px" font-weight="700">5. Contêiner / infra</text><text x="24" y="506" fill="#4b5563" font-size="12px" font-weight="400">raio de impacto</text><rect width="176" height="52" x="188" y="466" fill="#fff" stroke="#d1d5db" rx="6"/><text x="276" y="489" fill="#1f2937" font-size="12px" font-weight="400" text-anchor="middle">Rebuild sem cache,</text><text x="276" y="506" fill="#1f2937" font-size="12px" font-weight="400" text-anchor="middle">fixar tags e digests</text><rect width="176" height="52" x="376" y="466" fill="#fff" stroke="#d1d5db" rx="6"/><text x="464" y="489" fill="#1f2937" font-size="12px" font-weight="400" text-anchor="middle">Non-root, FS somente leitura,</text><text x="464" y="506" fill="#1f2937" font-size="12px" font-weight="400" text-anchor="middle">capabilities removidas</text><rect width="176" height="52" x="564" y="466" fill="#fff" stroke="#d1d5db" rx="6"/><text x="652" y="489" fill="#1f2937" font-size="12px" font-weight="400" text-anchor="middle">Limite de memória, filtro</text><text x="652" y="506" fill="#1f2937" font-size="12px" font-weight="400" text-anchor="middle">de egress, segredos restritos</text><path stroke="#6b7280" stroke-width="1.5" d="M380 530v16"/><path fill="#6b7280" d="M375 545h10l-5 8Z"/><rect width="740" height="76" x="10" y="554" fill="#f3f4f6" stroke="#9ca3af" rx="8"/><text x="24" y="586" fill="#1f2937" font-size="14px" font-weight="700">6. Monitoramento</text><text x="24" y="606" fill="#4b5563" font-size="12px" font-weight="400">toda camada reporta aqui</text><rect width="176" height="52" x="188" y="566" fill="#fff" stroke="#d1d5db" rx="6"/><text x="276" y="589" fill="#1f2937" font-size="12px" font-weight="400" text-anchor="middle">Eventos do WAF</text><text x="276" y="606" fill="#1f2937" font-size="12px" font-weight="400" text-anchor="middle">para o SIEM</text><rect width="176" height="52" x="376" y="566" fill="#fff" stroke="#d1d5db" rx="6"/><text x="464" y="589" fill="#1f2937" font-size="12px" font-weight="400" text-anchor="middle">Shells em workers,</text><text x="464" y="606" fill="#1f2937" font-size="12px" font-weight="400" text-anchor="middle">crashes, fatais de memória</text><rect width="176" height="52" x="564" y="566" fill="#fff" stroke="#d1d5db" rx="6"/><text x="652" y="589" fill="#1f2937" font-size="12px" font-weight="400" text-anchor="middle">Runbook: revisar, negar,</text><text x="652" y="606" fill="#1f2937" font-size="12px" font-weight="400" text-anchor="middle">rotacionar segredos</text><text x="380" y="666" fill="#374151" font-size="13px" font-weight="600" text-anchor="middle">Só a camada 4 remove a vulnerabilidade. As outras reduzem a exposição e limitam o dano.</text></svg>