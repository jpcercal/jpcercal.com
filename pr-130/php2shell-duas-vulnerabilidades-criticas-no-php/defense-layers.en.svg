<svg xmlns="http://www.w3.org/2000/svg" width="760" height="684" viewBox="0 0 760 684" role="img" aria-labelledby="t d">
<title id="t">Defense layers for PHP2Shell</title>
<desc id="d">Six stacked layers from the internet to monitoring: edge WAF, reverse proxy, application, PHP runtime, container and infrastructure, and monitoring. Only the PHP runtime layer, the patch, removes the vulnerability.</desc>
<rect width="760" height="684" fill="#ffffff"/>
<style>text{font-family:Helvetica, Arial, sans-serif}</style>
<rect x="170" y="10" width="420" height="30" rx="15" fill="#fee2e2" stroke="#b91c1c"/>
<text x="380" y="30" font-size="13" font-weight="600" fill="#7f1d1d" text-anchor="middle">Internet client: unauthenticated multipart POSTs</text>
<line x1="380" y1="40" x2="380" y2="46" stroke="#6b7280" stroke-width="1.5"/><polygon points="375,45 385,45 380,53" fill="#6b7280"/>
<rect x="10" y="54" width="740" height="76" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1"/>
<text x="24" y="86" font-size="14" font-weight="700" fill="#1f2937" text-anchor="start">1. Edge</text>
<text x="24" y="106" font-size="12" font-weight="400" fill="#4b5563" text-anchor="start">WAF (Akamai example)</text>
<rect x="188.0" y="66" width="176.0" height="52" rx="6" fill="#ffffff" stroke="#d1d5db"/>
<text x="276.0" y="89" font-size="12" font-weight="400" fill="#1f2937" text-anchor="middle">Managed rules in Deny</text>
<text x="276.0" y="106" font-size="12" font-weight="400" fill="#1f2937" text-anchor="middle">ASE 3000991, cmd injection</text>
<rect x="376.0" y="66" width="176.0" height="52" rx="6" fill="#ffffff" stroke="#d1d5db"/>
<text x="464.0" y="89" font-size="12" font-weight="400" fill="#1f2937" text-anchor="middle">Custom virtual patch</text>
<text x="464.0" y="106" font-size="12" font-weight="400" fill="#1f2937" text-anchor="middle">multipart shape and size</text>
<rect x="564.0" y="66" width="176.0" height="52" rx="6" fill="#ffffff" stroke="#d1d5db"/>
<text x="652.0" y="89" font-size="12" font-weight="400" fill="#1f2937" text-anchor="middle">Rate limits and</text>
<text x="652.0" y="106" font-size="12" font-weight="400" fill="#1f2937" text-anchor="middle">origin lock-down</text>
<line x1="380" y1="130" x2="380" y2="146" stroke="#6b7280" stroke-width="1.5"/><polygon points="375,145 385,145 380,153" fill="#6b7280"/>
<rect x="10" y="154" width="740" height="76" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1"/>
<text x="24" y="186" font-size="14" font-weight="700" fill="#1f2937" text-anchor="start">2. Proxy / web server</text>
<text x="24" y="206" font-size="12" font-weight="400" fill="#4b5563" text-anchor="start">before PHP</text>
<rect x="188.0" y="166" width="176.0" height="52" rx="6" fill="#ffffff" stroke="#d1d5db"/>
<text x="276.0" y="189" font-size="12" font-weight="400" fill="#1f2937" text-anchor="middle">Hard limits: size,</text>
<text x="276.0" y="206" font-size="12" font-weight="400" fill="#1f2937" text-anchor="middle">parts, headers, nesting</text>
<rect x="376.0" y="166" width="176.0" height="52" rx="6" fill="#ffffff" stroke="#d1d5db"/>
<text x="464.0" y="189" font-size="12" font-weight="400" fill="#1f2937" text-anchor="middle">Reject multipart without</text>
<text x="464.0" y="206" font-size="12" font-weight="400" fill="#1f2937" text-anchor="middle">usable Content-Length</text>
<rect x="564.0" y="166" width="176.0" height="52" rx="6" fill="#ffffff" stroke="#d1d5db"/>
<text x="652.0" y="189" font-size="12" font-weight="400" fill="#1f2937" text-anchor="middle">Multipart only on</text>
<text x="652.0" y="206" font-size="12" font-weight="400" fill="#1f2937" text-anchor="middle">routes that need it</text>
<line x1="380" y1="230" x2="380" y2="246" stroke="#6b7280" stroke-width="1.5"/><polygon points="375,245 385,245 380,253" fill="#6b7280"/>
<rect x="10" y="254" width="740" height="76" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1"/>
<text x="24" y="286" font-size="14" font-weight="700" fill="#1f2937" text-anchor="start">3. Application</text>

<rect x="188.0" y="266" width="270.0" height="52" rx="6" fill="#ffffff" stroke="#d1d5db"/>
<text x="323.0" y="289" font-size="12" font-weight="400" fill="#1f2937" text-anchor="middle">Uploads behind authentication</text>
<text x="323.0" y="306" font-size="12" font-weight="400" fill="#1f2937" text-anchor="middle">and CSRF protection</text>
<rect x="470.0" y="266" width="270.0" height="52" rx="6" fill="#ffffff" stroke="#d1d5db"/>
<text x="605.0" y="289" font-size="12" font-weight="400" fill="#1f2937" text-anchor="middle">Validate input, fail closed</text>
<text x="605.0" y="306" font-size="12" font-weight="400" fill="#1f2937" text-anchor="middle">with a 4xx on bad bodies</text>
<line x1="380" y1="330" x2="380" y2="346" stroke="#6b7280" stroke-width="1.5"/><polygon points="375,345 385,345 380,353" fill="#6b7280"/>
<rect x="10" y="354" width="740" height="76" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
<text x="24" y="386" font-size="14" font-weight="700" fill="#1f2937" text-anchor="start">4. PHP runtime</text>
<text x="24" y="406" font-size="12" font-weight="400" fill="#4b5563" text-anchor="start">the actual fix</text>
<rect x="188.0" y="366" width="176.0" height="52" rx="6" fill="#fde68a" stroke="#b45309"/>
<text x="276.0" y="389" font-size="12" font-weight="700" fill="#1f2937" text-anchor="middle">PATCH: 8.5.12, 8.4.27,</text>
<text x="276.0" y="406" font-size="12" font-weight="700" fill="#1f2937" text-anchor="middle">8.3.36, 8.2.35</text>
<rect x="376.0" y="366" width="176.0" height="52" rx="6" fill="#ffffff" stroke="#d1d5db"/>
<text x="464.0" y="389" font-size="12" font-weight="400" fill="#1f2937" text-anchor="middle">Interim and partial: ini</text>
<text x="464.0" y="406" font-size="12" font-weight="400" fill="#1f2937" text-anchor="middle">changes, cgroup limit</text>
<rect x="564.0" y="366" width="176.0" height="52" rx="6" fill="#ffffff" stroke="#d1d5db"/>
<text x="652.0" y="389" font-size="12" font-weight="400" fill="#1f2937" text-anchor="middle">Restart</text>
<text x="652.0" y="406" font-size="12" font-weight="400" fill="#1f2937" text-anchor="middle">every worker</text>
<line x1="380" y1="430" x2="380" y2="446" stroke="#6b7280" stroke-width="1.5"/><polygon points="375,445 385,445 380,453" fill="#6b7280"/>
<rect x="10" y="454" width="740" height="76" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1"/>
<text x="24" y="486" font-size="14" font-weight="700" fill="#1f2937" text-anchor="start">5. Container / infra</text>
<text x="24" y="506" font-size="12" font-weight="400" fill="#4b5563" text-anchor="start">blast radius</text>
<rect x="188.0" y="466" width="176.0" height="52" rx="6" fill="#ffffff" stroke="#d1d5db"/>
<text x="276.0" y="489" font-size="12" font-weight="400" fill="#1f2937" text-anchor="middle">Rebuild without cache,</text>
<text x="276.0" y="506" font-size="12" font-weight="400" fill="#1f2937" text-anchor="middle">pin tags and digests</text>
<rect x="376.0" y="466" width="176.0" height="52" rx="6" fill="#ffffff" stroke="#d1d5db"/>
<text x="464.0" y="489" font-size="12" font-weight="400" fill="#1f2937" text-anchor="middle">Non-root, read-only FS,</text>
<text x="464.0" y="506" font-size="12" font-weight="400" fill="#1f2937" text-anchor="middle">dropped capabilities</text>
<rect x="564.0" y="466" width="176.0" height="52" rx="6" fill="#ffffff" stroke="#d1d5db"/>
<text x="652.0" y="489" font-size="12" font-weight="400" fill="#1f2937" text-anchor="middle">Memory limit, egress</text>
<text x="652.0" y="506" font-size="12" font-weight="400" fill="#1f2937" text-anchor="middle">filter, scoped secrets</text>
<line x1="380" y1="530" x2="380" y2="546" stroke="#6b7280" stroke-width="1.5"/><polygon points="375,545 385,545 380,553" fill="#6b7280"/>
<rect x="10" y="554" width="740" height="76" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1"/>
<text x="24" y="586" font-size="14" font-weight="700" fill="#1f2937" text-anchor="start">6. Monitoring</text>
<text x="24" y="606" font-size="12" font-weight="400" fill="#4b5563" text-anchor="start">every layer reports here</text>
<rect x="188.0" y="566" width="176.0" height="52" rx="6" fill="#ffffff" stroke="#d1d5db"/>
<text x="276.0" y="589" font-size="12" font-weight="400" fill="#1f2937" text-anchor="middle">WAF events</text>
<text x="276.0" y="606" font-size="12" font-weight="400" fill="#1f2937" text-anchor="middle">to the SIEM</text>
<rect x="376.0" y="566" width="176.0" height="52" rx="6" fill="#ffffff" stroke="#d1d5db"/>
<text x="464.0" y="589" font-size="12" font-weight="400" fill="#1f2937" text-anchor="middle">Shells from workers,</text>
<text x="464.0" y="606" font-size="12" font-weight="400" fill="#1f2937" text-anchor="middle">crashes, memory fatals</text>
<rect x="564.0" y="566" width="176.0" height="52" rx="6" fill="#ffffff" stroke="#d1d5db"/>
<text x="652.0" y="589" font-size="12" font-weight="400" fill="#1f2937" text-anchor="middle">Runbook: review,</text>
<text x="652.0" y="606" font-size="12" font-weight="400" fill="#1f2937" text-anchor="middle">deny, rotate secrets</text>
<text x="380" y="666" font-size="13" font-weight="600" fill="#374151" text-anchor="middle">Only layer 4 removes the vulnerability. The others reduce exposure and limit damage.</text>
</svg>
